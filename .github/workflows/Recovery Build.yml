name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '11.0'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/OrangeFoxRecovery/device_xiaomi_garden'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'fox_11.0_Q'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/garden'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (if no common tree, leave blank)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (if no common tree, leave blank)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'garden'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_garden'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
 
    # You might want to Checkout your repo first, but not mandatory
    - name: Check Out
      uses: actions/checkout@v4

    # Cleanup The Actions Workspace Using Custom Composite Run Actions
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize workspace
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            git python3 tar aria2
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') || 
          startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') ||
          startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Sync OrangeFox sources and minimal manifest
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        git clone ${{ github.event.inputs.SYNC_URL }}
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      if: |
        github.event.inputs.COMMON_TREE_URL != null
        && github.event.inputs.COMMON_PATH != null
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building recovery
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        rm -rf bootable/recovery &&git clone https://github.com/ShazuxD/bootable_recovery -b fox_12.1 bootable/recovery 
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng && make clean && mka adbd ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Check the output directory before uploading
      run: |
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/
        echo
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        
    - name: SSH into runner (Pinggy)
      if: ${{ !cancelled() && github.event.inputs.ENABLE_SSH == 'true' }}
      env:
        PUBKEY: ${{ secrets.SSH_PUBLIC_KEY }}
        SESSION_MINUTES: ${{ github.event.inputs.SSH_MINUTES || '60' }}
      run: |
        # ---- validate key ----
        echo "$PUBKEY" > /tmp/key.pub
        case "$PUBKEY" in
          ssh-ed25519\ *|ssh-rsa\ *|ecdsa-sha2-*) ;;
          *) echo "SSH_PUBLIC_KEY secret is missing or not a public key."; exit 1 ;;
        esac
        ssh-keygen -l -f /tmp/key.pub || { echo "Invalid public key"; exit 1; }

        # ---- key-only sshd ----
        sudo apt-get install -y openssh-server
        sudo mkdir -p /run/sshd
        sudo tee /etc/ssh/sshd_config.d/00-hardening.conf > /dev/null << 'CONF'
        PasswordAuthentication no
        KbdInteractiveAuthentication no
        PermitRootLogin no
        PubkeyAuthentication yes
        AllowUsers runner
        MaxAuthTries 3
        CONF
        sudo systemctl restart ssh || sudo service ssh restart
        sudo passwd -l runner || true
        mkdir -p ~/.ssh
        cat /tmp/key.pub > ~/.ssh/authorized_keys
        chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys

        # ---- tunnel ----
        start_tunnel() {
          pkill -f "tcp@free.pinggy.io" 2>/dev/null || true
          pkill -f "tail -f /dev/null" 2>/dev/null || true
          : > /tmp/pinggy.log
          ( tail -f /dev/null | ssh -tt -p 443 \
              -R0:localhost:22 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=3 \
              -o ExitOnForwardFailure=yes \
              tcp@free.pinggy.io > /tmp/pinggy.log 2>&1 ) &
          for i in $(seq 1 30); do
            URL=$(grep -oE 'tcp://[A-Za-z0-9.-]+:[0-9]+' /tmp/pinggy.log | tail -1)
            [ -n "$URL" ] && return 0
            sleep 2
          done
          return 1
        }

        ok=0
        for try in 1 2 3; do
          if start_tunnel; then ok=1; break; fi
          echo "Tunnel attempt $try failed, retrying..."
          cat /tmp/pinggy.log
        done
        if [ "$ok" != "1" ]; then
          echo "Could not open tunnel. Log:"
          cat /tmp/pinggy.log
          exit 1
        fi

        END=$(( $(date +%s) + SESSION_MINUTES * 60 ))

        while [ "$(date +%s)" -lt "$END" ]; do
          if [ -f /tmp/continue ]; then echo "Stop file found, ending."; break; fi

          if ! pgrep -f "tcp@free.pinggy.io" > /dev/null; then
            echo "Tunnel dropped, reconnecting..."
            start_tunnel || { sleep 5; continue; }
          fi

          URL=$(grep -oE 'tcp://[A-Za-z0-9.-]+:[0-9]+' /tmp/pinggy.log | tail -1)
          HP=${URL#tcp://}; HOST=${HP%:*}; PORT=${HP##*:}

          echo "=============================================="
          echo "SSH      : ssh -p $PORT runner@$HOST"
          echo "Build dir: $GITHUB_WORKSPACE/workspace"
          echo "Time left: $(( (END - $(date +%s)) / 60 )) min"
          echo "(run 'touch /tmp/continue' in the session to stop early)"
          echo "=============================================="
          sleep 30
        done
